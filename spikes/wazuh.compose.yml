# P1 Wazuh spike: 1 manager + 2 agents, shared virtual-time offset, per-container state volumes.
# Driven by `iris spike wazuh`. Real clock; the runner shifts records at export.

services:
  manager:
    image: iris/wazuh-manager:spike
    container_name: iris-spike-wazuh-manager
    hostname: siem-01
    volumes: [mgr_ossec:/var/ossec]

  agent1:
    image: iris/wazuh-agent:spike
    container_name: iris-spike-wazuh-agent1
    hostname: web-01
    environment:
      WAZUH_MANAGER: manager
      AGENT_NAME: spike-web-01
    volumes: [a1_ossec:/var/ossec]
    depends_on: [manager]

  agent2:
    image: iris/wazuh-agent:spike
    container_name: iris-spike-wazuh-agent2
    hostname: db-01
    environment:
      WAZUH_MANAGER: manager
      AGENT_NAME: spike-db-01
    volumes: [a2_ossec:/var/ossec]
    depends_on: [manager]

volumes:
  mgr_ossec:
  a1_ossec:
  a2_ossec:
