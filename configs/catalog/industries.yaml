sizes:
  weights: {S: 5, M: 4, L: 1}
  #: role -> [min, max] count. Workstations are REPRESENTATIVES (population_size carries the headcount).
  roles:
    S:
      web_server: [1, 1]
      app_server: [1, 1]
      database: [1, 1]
      dns_server: [1, 1]
      directory: [0, 1]
      file_server: [0, 1]
      mail_server: [0, 1]
      backup_server: [0, 1]
      siem: [1, 1]
      workstation: [1, 2]
      admin_workstation: [1, 1]
      bastion: [0, 0]
    M:
      web_server: [1, 2]
      app_server: [1, 2]
      database: [1, 2]
      dns_server: [1, 1]
      directory: [1, 1]
      file_server: [1, 1]
      mail_server: [0, 1]
      backup_server: [0, 1]
      siem: [1, 1]
      workstation: [2, 2]
      admin_workstation: [1, 1]
      bastion: [1, 1]
    L:
      web_server: [2, 3]
      app_server: [2, 3]
      database: [2, 2]
      dns_server: [1, 2]
      directory: [1, 1]
      file_server: [1, 1]
      mail_server: [1, 1]
      backup_server: [1, 1]
      siem: [1, 1]
      workstation: [2, 3]
      admin_workstation: [1, 2]
      bastion: [1, 1]
  #: Real headcount represented by each workstation container.
  population: {S: [10, 40], M: [40, 200], L: [200, 800]}
  #: Human identities in the directory.
  identities: {S: [8, 15], M: [20, 40], L: [40, 80]}
  #: Container budget (laptop lane cap is 20).
  container_cap: {S: 14, M: 20, L: 26}

maturity:
  weights: {low: 1, medium: 1, high: 1}
  mfa_probability: {low: 0.2, medium: 0.6, high: 0.95}
  agent_coverage:
    servers: {low: 0.75, medium: 0.9, high: 1.0}
    workstations: {low: 0.6, medium: 0.85, high: 0.95}
  extra_allow_rules: {low: [1, 3], medium: [0, 1], high: [0, 0]}
  weakness_count: {low: [3, 6], medium: [1, 4], high: [0, 2]}
  tls_probability: {low: 0.4, medium: 0.75, high: 0.95}

timezones: [Asia/Dubai, Asia/Riyadh, Europe/London, Europe/Berlin, America/New_York, Asia/Singapore]

calendar:
  #: Enrichment snapshot date. Calendars are anchored 6-18 months before it (INPUT Part 2, B8).
  intel_snapshot_date: 2026-11-01
  anchor_months_before: [6, 18]
  horizon_days: [30, 90]
  episodes: [2, 3]
  observe_minutes: 10
