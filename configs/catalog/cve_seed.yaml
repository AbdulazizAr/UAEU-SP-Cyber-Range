# Offline CVE seed catalog (builder brief file 03 §3, option B).
#
# A COMPACT set of real, well-known CVEs for the software catalog. The generator reads ONLY
# this pinned snapshot; it never calls NVD/KEV/EPSS and never invents a CVE ID, score, date
# or fixed version. Where a field could not be stated with confidence it is omitted (CVSS is
# optional; the model tolerates its absence) rather than guessed.
#
# Honesty (brief file 03 §3, DATASHEET): this is a hand-curated seed, not a full NVD mirror.
# `review_status: unreviewed` entries are DRAFTS — included in generation but every finding
# records source + review_status so a human (or a real pinned NVD/Trivy snapshot, option A)
# can confirm them before any result is called "validated". `needs_human_review: true`
# entries are excluded from default generation.
#
# date-gating: at virtual time T a finding/enrichment shows a CVE only if published_at <= T,
# a KEV flag only if kev.date_added <= T, EPSS only if a dated value <= T exists.
