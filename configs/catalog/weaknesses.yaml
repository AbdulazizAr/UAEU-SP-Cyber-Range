# Weakness modules v0 (INPUT Part 1, 3.4). Kind A (version CVEs) comes from installed
# versions and the scanner, so it is not sampled here. Each module names the control whose
# absence enables it (the causal-control truth used by the oracle for D4).
catalog_version: "0.2.0"  # 0.2.0: `requires: tls` (weak TLS only on services that serve TLS)

modules:
  web.sqli_login:        {kind: C, recipe: flask_shop, control: CTRL-APP-001, cwe: CWE-89, attackable: true, weight: 3}
  web.path_traversal:    {kind: C, recipe: flask_shop, control: CTRL-APP-001, cwe: CWE-22, attackable: true, weight: 2}
  web.idor_object:       {kind: C, recipe: flask_shop, control: CTRL-APP-002, cwe: CWE-639, attackable: true, weight: 2}
  web.privilege_update:  {kind: C, recipe: flask_shop, control: CTRL-APP-002, cwe: CWE-269, attackable: true, weight: 1}
  web.admin_exposed:     {kind: B, recipe: nginx, control: CTRL-NET-003, cwe: CWE-284, attackable: true, weight: 1}
  tls.weak_config:       {kind: B, recipe: nginx, control: CTRL-CRY-001, cwe: CWE-326, attackable: false, weight: 2, requires: tls}
  auth.ssh_password:     {kind: B, recipe: openssh, control: CTRL-IAM-002, cwe: CWE-287, attackable: true, weight: 3}
  auth.ssh_root_login:   {kind: B, recipe: openssh, control: CTRL-IAM-004, cwe: CWE-250, attackable: true, weight: 1}
  auth.shared_ssh_key:   {kind: B, recipe: openssh, control: CTRL-IAM-005, cwe: CWE-798, attackable: true, weight: 1}
  db.default_creds:      {kind: B, recipe: postgresql, control: CTRL-IAM-003, cwe: CWE-1392, attackable: true, weight: 2}
  db.listen_all:         {kind: B, recipe: postgresql, control: CTRL-NET-002, cwe: CWE-1327, attackable: true, weight: 2}
  smb.anonymous_share:   {kind: B, recipe: samba, control: CTRL-ACC-002, cwe: CWE-284, attackable: true, weight: 2}
  ldap.anonymous_bind:   {kind: B, recipe: openldap, control: CTRL-ACC-004, cwe: CWE-287, attackable: true, weight: 1}
  host.sudo_nopasswd:    {kind: B, recipe: openssh, control: CTRL-ACC-003, cwe: CWE-250, attackable: true, weight: 2}
  backup.unauth_repo:    {kind: B, recipe: restic_rest, control: CTRL-ACC-005, cwe: CWE-306, attackable: true, weight: 1}
  mail.open_relay:       {kind: B, recipe: postfix, control: CTRL-NET-004, cwe: CWE-284, attackable: false, weight: 1}
